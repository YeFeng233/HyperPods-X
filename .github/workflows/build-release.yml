name: Build and release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Version tag, matching the app version and release notes
        required: true
        default: v0.4.6
        type: string
      publish_release:
        description: Publish the verified files to GitHub Releases
        default: false
        type: boolean
      prerelease:
        description: Mark this version as a preview
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Check out the Glasmio source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NEORUAA/Glasmio
          ref: 5fcc8aa4c9ea4ed229fd181849f2c5e1982dda5d
          path: .tooling/Glasmio
          persist-credentials: false

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$sdkmanager" --licenses > /dev/null
          set -o pipefail
          "$sdkmanager" --install 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

      - name: Restore the application font
        env:
          FONT_URL: ${{ secrets.SF_PRO_FONT_URL }}
          FONT_SHA256: ${{ vars.SF_PRO_FONT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$FONT_URL" ] || ! [[ "$FONT_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo 'SF_PRO_FONT_URL and SF_PRO_FONT_SHA256 must identify the SF Pro font used by the app.' >&2
            exit 1
          fi
          font="$RUNNER_TEMP/hyperpods-sf-pro.ttf"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' "$FONT_URL" --output "$font"
          printf '%s  %s\n' "$FONT_SHA256" "$font" | sha256sum --check --status
          printf 'HYPERPODS_SF_PRO=%s\n' "$font" >> "$GITHUB_ENV"

      - name: Restore the project test signing identity
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo 'The ANDROID_DEBUG_KEYSTORE_BASE64 repository secret is required.' >&2
            exit 1
          fi
          keystore="$RUNNER_TEMP/hyperpods-test.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          fingerprint=$(keytool -exportcert -keystore "$keystore" -storepass android \
            -alias androiddebugkey | sha256sum | cut -d ' ' -f 1)
          expected=$(tr -d '\r\n' < .github/signing-certificate.sha256)
          if [ "$fingerprint" != "$expected" ]; then
            echo 'The restored signing certificate does not match this project.' >&2
            exit 1
          fi
          printf 'HYPERPODS_TEST_KEYSTORE=%s\n' "$keystore" >> "$GITHUB_ENV"

      - name: Test, lint and build the optimized APK
        shell: bash
        run: |
          ./gradlew --no-daemon --console=plain -Dorg.gradle.workers.max=2 \
            -Pglasmio.source=true -Pglasmio.sourceDir=.tooling/Glasmio \
            :app:testDebugUnitTest :core:protocol:test :app:lintDebug :app:assembleDeviceTest

      - name: Verify the APK and package the release
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs \
            app/build/outputs/apk/deviceTest/app-deviceTest.apk > "$RUNNER_TEMP/apk-signature.txt"
          cat "$RUNNER_TEMP/apk-signature.txt"
          python3 .github/scripts/package_release.py --tag "$RELEASE_TAG" \
            --signature-report "$RUNNER_TEMP/apk-signature.txt" --output dist/github-release

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: HyperPods-X-${{ inputs.release_tag }}
          path: dist/github-release/
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          notes="docs/releases/$RELEASE_TAG.md"
          if gh release view "$RELEASE_TAG" --json isDraft,targetCommitish > "$RUNNER_TEMP/release-state.json" 2>/dev/null; then
            jq -e --arg commit "$GITHUB_SHA" '.isDraft == true and .targetCommitish == $commit' \
              "$RUNNER_TEMP/release-state.json" > /dev/null || {
                echo 'Refusing to replace a published release or a draft for a different commit.' >&2
                exit 1
              }
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft \
              --title "HyperPods-X $RELEASE_TAG" --notes-file "$notes" --prerelease="$PRERELEASE"
          fi
          gh release upload "$RELEASE_TAG" dist/github-release/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$PRERELEASE" \
            --title "HyperPods-X $RELEASE_TAG" --notes-file "$notes"
          gh release view "$RELEASE_TAG" --json url --jq .url
